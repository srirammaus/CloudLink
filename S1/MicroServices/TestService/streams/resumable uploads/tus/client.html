<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TUS Upload Example</title>
  <script src="https://unpkg.com/tus-js-client/dist/tus.min.js"></script>
</head>
<body>
  <h2>Upload File (TUS)</h2>
  <input type="file" id="fileInput">
  <button onclick="startUpload()">Upload</button>
  <pre id="log"></pre>

  <script>
    function startUpload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("Please select a file.");

      const upload = new tus.Upload(file, {
        endpoint: "http://localhost:8084/streams/resumable%20uploads/tus/server.php", // your TUS endpoint
        chunkSize: 1 * 1024 * 1024, // 1MB chunks
        retryDelays: [0, 3000, 5000],
        metadata: {
          filename: file.name,
          filetype: file.type
        },
        onError: (error) => {
          document.getElementById('log').textContent += "❌ " + error + "\n";
        },
        onProgress: (bytesUploaded, bytesTotal) => {
          const percent = ((bytesUploaded / bytesTotal) * 100).toFixed(2);
          document.getElementById('log').textContent = `Uploading: ${percent}%`;
        },
        onSuccess: () => {
          document.getElementById('log').textContent += "\n✅ Upload complete!";
        }
      });

      upload.start();
    }
  </script>
</body>
</html>
